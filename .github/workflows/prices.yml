
name: Refresh prices

on:
  schedule:
    - cron: "30 22 * * *"   # 06:30 Singapore time, ahead of the 07:00 ledger refresh
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance
      - run: python fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name  "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "prices $(date -u +%F)"
          git push
